name: Gates

# Every gate in this repo, on every push and every pull request.
#
# All four EXIT NON-ZERO on failure (Doctrine §4, §16.8): a checker that prints
# "FAIL" and exits 0 is a reporter, and the hub carries the scar from believing
# a documented gate that never ran.
#
# Runs on pull_request as well as push — a PR that runs zero checks is how a
# regression reaches main with a green tick beside it.
#
# Actions are pinned by SHA, not tag (Doctrine §16.1). A tag is a mutable
# pointer someone else controls. Dependabot keeps the pins current.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # npm ci, never npm install (Doctrine §16.1) — the lockfile is the pin.
      - run: npm ci

      # The sandbox Chromium at /opt/pw-browsers does not exist on a runner, so
      # playwright-core downloads the revision it is pinned to. Same browser
      # build either way; every gate detects which is present.
      - run: npx --no-install playwright-core install --with-deps chromium

      # Unit tests first: they are the cheapest and cover the math core, which
      # everything else is built on (spec §11.8).
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Doctrine §4 — accessibility is a hard gate.
      - name: Accessibility gate
        run: node a11y-gate.mjs

      # Spec §11 acceptance criteria.
      - name: Acceptance gate
        run: node acceptance.mjs

      # Acceptance §11.1 and spec §10 — installs, cuts the network, reloads.
      - name: Offline gate
        run: node offline-check.mjs

  # These gates are CANONICAL IN THE HUB and are never forked into this repo
  # (PALETTES.md, and hub CLAUDE.md). The hub is checked out read-only and its
  # instruments are pointed at this app, so a change here is measured by the
  # same code every sibling app is measured by — four copies that drift is the
  # exact thing this avoids.
  doctrine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: app
          persist-credentials: false

      # No `ref:` — this DELIBERATELY tracks the hub's default branch, and it
      # is the one place §16.1's "pin what executes" is knowingly not applied.
      # Pinning it to a SHA would give each sibling its own frozen copy of the
      # instruments, which is the drift this whole arrangement exists to
      # prevent. Do not "fix" it.
      #
      # The cost is real and it has already been paid once: an instrument used
      # here must be ON HUB MAIN before this job can pass. Adding a step that
      # calls a new hub script, while that script sits on a hub working branch,
      # makes this job fail with MODULE_NOT_FOUND until the hub lands — it went
      # red for three runs that way (LESSONS §7b). Land the hub side first.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: njefferson/noahjefferson
          path: hub
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Palette gate (hub instrument, app values)
        run: node hub/palette-check.mjs app/palettes/photo-field-tools.json

      # Workflow security. zizmor is a MAINTAINED, off-the-shelf auditor and it
      # is doing the heavy lifting here — on its first run against this repo it
      # found template injection and credential persistence in workflows this
      # project had hand-written, while a bespoke checker sat beside them
      # finding nothing. Standard tooling first; hand-rolled only where nothing
      # standard exists.
      # The zizmor VERSION is canonical in the hub too, pinned by version and
      # hash in hub/.github/requirements-ci.txt, so every sibling repo is
      # audited by the same build of the same auditor. `pip install zizmor`
      # was here until it was noticed that it floats on whatever PyPI serves
      # that morning — an unpinned tool fetch inside the workflow that enforces
      # pinning (§16.1). --require-hashes rejects a swapped artefact;
      # --only-binary stops a silent fall back to a source build.
      - name: Install zizmor (pinned in the hub)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --only-binary=:all: \
            --require-hashes -r hub/.github/requirements-ci.txt

      # --strict-collection turns an unparseable workflow into a FAILURE.
      # Without it zizmor warns, SKIPS the file and still exits 0 — a YAML
      # error means that workflow is never audited and the run still prints
      # "No findings. Good job!".
      - name: Workflow security audit
        run: |
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --strict-collection \
            --min-severity medium app/.github/workflows/

      # What zizmor does NOT cover: npm hygiene. Lockfile present, `npm ci`
      # rather than `npm install`, no undeclared dependencies (Doctrine §16.3).
      - name: npm hygiene (hub instrument)
        run: node hub/pin-check.mjs --repo app

      # LESSONS §26 — a staged candidate must be recorded with its URL and
      # version, and no instruction may tell an iPad-first owner to go and
      # fetch a file. The acknowledgement half cannot run in CI (there is no
      # session to ask), so only the mechanical half is enforced here; the
      # session runs the full thing before handing over.
      - name: Handoff gate, mechanical half (hub instrument)
        run: node hub/handoff-check.mjs --repo app --ack=deploy-url,evidence,attachments,manual-steps
